# Prometheus configuration
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    scrapeTimeout: "90s"
    scrapeInterval: "90s"

# Grafana configuration
grafana:
  sidecar:
    datasources:
      defaultDatasourceEnabled: true
      datasources:
        # Prometheus datasource
        prometheus.yaml:
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              url: http://prom-kube-prometheus-stack-prometheus:9090
              access: proxy
              isDefault: true

        # Loki datasource
        loki.yaml:
          apiVersion: 1
          datasources:
            - name: Loki
              type: loki
              url: http://loki:3100
              access: proxy

        # Tempo datasource
        tempo.yaml:
          apiVersion: 1
          datasources:
            - name: Tempo
              type: tempo
              url: http://tempo:3100
              access: proxy
              jsonData:
                httpMethod: GET
                tracesToLogs:
                  datasourceUid: 'loki'  # Link Loki for trace-to-logs

# Loki configuration
loki:
  enabled: true
  config:
    auth_enabled: false
    ingester:
      lifecycler:
        address: 0.0.0.0
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
    schema_config:
      configs:
        - from: "2023-01-01"
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    server:
      http_listen_port: 3100
    storage_config:
      boltdb_shipper:
        active_index_directory: /var/loki/index
        cache_location: /var/loki/cache
        shared_store: filesystem
      filesystem:
        directory: /var/loki/chunks

promtail:
  enabled: true
  config:
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki:3100/loki/api/v1/push

# Tempo configuration
tempo:
  enabled: true
  config:
    server:
      http_listen_port: 3100
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo
    querier:
      frontend_worker:
        frontend_address: tempo-query-frontend:9095