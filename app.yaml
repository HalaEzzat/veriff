apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
data:
  POSTGRES_USER: "gbfs_user"
  POSTGRES_PASSWORD: "gbfs_password"
  POSTGRES_DB: "gbfs_db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:latest
          envFrom:
            - configMapRef:
                name: postgres-config
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          emptyDir: {}  # Use ephemeral storage
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gbfs-scraper-config
data:
  DB_HOST: "postgres"
  DB_NAME: "gbfs_db"
  DB_USER: "gbfs_user"
  DB_PASSWORD: "gbfs_password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gbfs-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gbfs-scraper
  template:
    metadata:
      labels:
        app: gbfs-scraper
    spec:
      containers:
        - name: gbfs-scraper
          image: hala1994/python-app:latest  # Replace with your Docker image
          envFrom:
            - configMapRef:
                name: gbfs-scraper-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: gbfs-scraper
spec:
  selector:
    app: gbfs-scraper
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000