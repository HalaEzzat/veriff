name: Manage EKS Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action (deploy/destroy)"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - destroy

jobs:
  deploy:
    if: github.event.inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.0.0  # Specify your required Terraform version

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Set up kubectl for EKS
        run: aws eks update-kubeconfig --region us-east-1 --name veriff-cluster

      - name: Verify Deployment
        run: kubectl get pods 
      
      - name: Deploy Sample Application
        run: |
          kubectl apply -f db.yaml
          kubectl apply -f discounts.yaml
          kubectl apply -f frontend.yaml
          kubectl apply -f advertisements.yaml

      - name: Create Datadog secrets in Kubernetes
        run: |
          kubectl delete secret datadog-secret --ignore-not-found
          kubectl create secret generic datadog-secret --from-literal=api-key=${{ secrets.DATADOG_API_KEY }} 
          kubectl delete secret datadog-app-secret --ignore-not-found
          kubectl create secret generic datadog-app-secret --from-literal=app-key=${{ secrets.DATADOG_APP_KEY }} 
      
      - name: Deploy Datadog Agent using Helm
        run: |
          helm repo add datadog https://helm.datadoghq.com
          helm repo update
          helm upgrade --install datadog-agent datadog/datadog -f values.yaml

      - name: Deploy Grafana and promethues
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          
          helm upgrade --install prom prometheus-community/kube-prometheus-stack \
            --values grafana-values.yaml

          # Deploy Grafana (Monitoring UI)
          helm upgrade --install grafana grafana/grafana \
            --set persistence.enabled=false --set service.type=LoadBalancer \
            --set adminPassword=supersecurepassword

  destroy:
    if: github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.0.0  # Specify your required Terraform version

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve